name: CAT'Allo - Auto Extract

on:
  push:
    branches:
      - main
    paths:
      - 'catallo.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier catallo.zip
        run: |
          if [ ! -f "catallo.zip" ]; then
            echo "ERREUR : catallo.zip introuvable"
            exit 1
          fi

      - name: Préparer l'extraction
        run: |
          rm -rf catallo_tmp
          mkdir -p catallo_tmp

      - name: Extraire CAT'Allo
        run: |
          unzip -o catallo.zip -d catallo_tmp

      - name: Protéger les workflows GitHub
        run: |
          rm -rf catallo_tmp/.github

      - name: Vérifier le projet
        run: |
          test -f catallo_tmp/settings.gradle || {
            echo "ERREUR : settings.gradle introuvable"
            exit 1
          }

          test -f catallo_tmp/build.gradle || {
            echo "ERREUR : build.gradle introuvable"
            exit 1
          }

          test -f catallo_tmp/app/build.gradle || {
            echo "ERREUR : app/build.gradle introuvable"
            exit 1
          }

      - name: Copier les fichiers CAT'Allo
        run: |
          cp -a catallo_tmp/. .
          rm -rf catallo_tmp

      - name: Enregistrer les fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git commit -m "CAT'Allo - extraction automatique"
          git push
