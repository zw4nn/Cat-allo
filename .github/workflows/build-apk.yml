name: Build CAT'Allo APK

on:
  push:
    branches:
      - main
    paths:
      - 'catallo.zip'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser catallo.zip
        run: |
          rm -rf project
          mkdir -p project
          unzip -o catallo.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lire la version
        working-directory: project
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)

          if [ -z "$VERSION_NAME" ]; then
            echo "versionName introuvable"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version CAT'Allo : $VERSION_NAME"

      - name: Compiler CAT'Allo
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        shell: bash
        run: |
          APK=$(find project/app/build/outputs/apk/debug -name "*.apk" | head -n1)

          if [ -z "$APK" ]; then
            echo "APK introuvable"
            exit 1
          fi

          cp "$APK" "catallo-${VERSION_NAME}.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: catallo-${{ env.VERSION_NAME }}
          path: catallo-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
