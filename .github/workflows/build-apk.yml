name: Build Alocats APK

on:
  push:
    branches:
      - main
    paths:
      - 'alocats.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract alocats.zip
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -o alocats.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Read app version
        working-directory: project
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "versionName not found"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Alocats version: $VERSION_NAME"

      - name: Build APK
        working-directory: project
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find project/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "alocats-${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: alocats-${{ env.VERSION_NAME }}
          path: alocats-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          
