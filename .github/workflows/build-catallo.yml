name: Build CAT'Allo APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Vérifier le projet
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Lire la version CAT'Allo
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)

          if [ -z "$VERSION_NAME" ]; then
            echo "Impossible de trouver versionName"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version CAT'Allo : $VERSION_NAME"

      - name: Compiler CAT'Allo
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Préparer l'APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)

          if [ -z "$APK" ]; then
            echo "APK introuvable"
            exit 1
          fi

          cp "$APK" "catallo-${VERSION_NAME}.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: catallo-${{ env.VERSION_NAME }}
          path: catallo-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
